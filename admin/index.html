<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>專欄管理後台｜新奇美診所</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
body { background: oklch(0.975 0.006 233.4); }
.admin-bar {
  background: var(--surface-deep);
  color: var(--on-deep);
  padding: 1rem 0;
}
.admin-bar .wrap { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
.admin-bar h1 { color: var(--on-deep); font-size: 1.2rem; letter-spacing: 0.2em; }
.admin-bar a { color: var(--on-deep-soft); font-size: 0.88rem; }
.admin-bar a:hover { color: #fff; }
.admin-main { padding-block: 2.5rem 5rem; }
.admin-grid { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 2rem; align-items: start; }
@media (max-width: 980px) { .admin-grid { grid-template-columns: 1fr; } }

.panel { background: #fff; border: 1px solid var(--hairline); }
.panel__head {
  padding: 1.1rem 1.4rem;
  border-bottom: 1px solid var(--hairline);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
}
.panel__head h2 { font-size: 1.05rem; letter-spacing: 0.15em; }
.panel__body { padding: 1.4rem; }

.post-admin-list { list-style: none; max-height: 60vh; overflow-y: auto; }
.post-admin-list li {
  padding: 1rem 1.4rem;
  border-bottom: 1px solid var(--hairline);
  cursor: pointer;
  transition: background 0.2s;
}
.post-admin-list li:hover { background: var(--surface); }
.post-admin-list li.is-active { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); }
.post-admin-list .t { display: block; font-weight: 500; line-height: 1.5; margin-bottom: 0.25rem; }
.post-admin-list .m { font-size: 0.78rem; color: var(--ink-soft); display: flex; gap: 0.8rem; flex-wrap: wrap; }
.badge { display: inline-block; font-size: 0.7rem; padding: 0.1rem 0.5rem; border-radius: 999px; letter-spacing: 0.08em; }
.badge--seed { background: var(--surface); border: 1px solid var(--hairline); color: var(--ink-soft); }
.badge--local { background: oklch(0.92 0.045 182); color: oklch(0.42 0.085 182); }
.badge--hidden { background: oklch(0.93 0.02 20); color: oklch(0.5 0.12 25); }

.field { margin-bottom: 1.2rem; }
.field label { display: block; font-size: 0.85rem; letter-spacing: 0.12em; color: var(--ink-soft); margin-bottom: 0.4rem; }
.field input[type="text"], .field input[type="date"], .field select, .field textarea {
  width: 100%;
  font: inherit;
  padding: 0.65rem 0.9rem;
  border: 1px solid var(--hairline);
  background: #fff;
  color: var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus, .editor:focus {
  outline: 2px solid var(--accent-soft);
  outline-offset: 1px;
}
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media (max-width: 640px) { .field-row { grid-template-columns: 1fr; } }

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem;
  padding: 0.6rem;
  border: 1px solid var(--hairline);
  border-bottom: none;
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 10;
}
.toolbar button {
  font-family: var(--font-sans);
  font-size: 0.85rem;
  padding: 0.4rem 0.75rem;
  background: #fff;
  border: 1px solid var(--hairline);
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s;
}
.toolbar button:hover { border-color: var(--ink); }
.toolbar .sep { width: 1px; background: var(--hairline); margin: 0.2rem 0.3rem; }
.editor {
  min-height: 380px;
  padding: 1.4rem;
  border: 1px solid var(--hairline);
  background: #fff;
  line-height: 1.9;
  overflow-y: auto;
}
.editor:empty::before { content: "在此開始撰寫文章內容…"; color: var(--ink-soft); }
.editor h2 { font-size: 1.4rem; margin: 1.4em 0 0.6em; border-bottom: 1px solid var(--hairline); padding-bottom: 0.4rem; }
.editor h3 { font-size: 1.15rem; margin: 1.2em 0 0.5em; }
.editor blockquote { border-left: 2px solid var(--accent); padding-left: 1em; color: var(--ink-soft); margin: 1em 0; }
.editor img { max-width: 100%; }
.editor ul, .editor ol { padding-left: 1.6em; }
#html-source { display: none; width: 100%; min-height: 380px; font-family: ui-monospace, monospace; font-size: 0.85rem; padding: 1.2rem; border: 1px solid var(--hairline); }

.actions { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 1.6rem; align-items: center; }
.btn--small { padding: 0.6rem 1.4rem; font-size: 0.88rem; }
.btn--danger { border-color: oklch(0.55 0.15 25); color: oklch(0.5 0.15 25); }
.btn--danger:hover { background: oklch(0.55 0.15 25); color: #fff; }

.hint {
  background: oklch(0.962 0.018 233.4);
  border: 1px solid oklch(0.875 0.035 233.4);
  padding: 1rem 1.2rem;
  font-size: 0.85rem;
  color: oklch(0.40 0.06 233.4);
  line-height: 1.8;
  margin-bottom: 1.6rem;
}
.hint strong { display: block; margin-bottom: 0.2rem; }

.toast {
  position: fixed;
  bottom: 1.6rem;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink-strong);
  color: #fff;
  padding: 0.8rem 1.6rem;
  font-size: 0.9rem;
  letter-spacing: 0.08em;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
  z-index: var(--z-toast);
}
.toast.is-show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="admin-bar">
  <div class="wrap">
    <h1>新奇美診所・專欄管理後台</h1>
    <nav style="display:flex; gap:1.4rem;">
      <a href="../blog/index.html" target="_blank">檢視前台專欄 ↗</a>
      <a href="../index.html">回到官網</a>
    </nav>
  </div>
</div>

<main class="admin-main">
  <div class="wrap">
    <div class="hint">
      <strong>發佈流程說明</strong>
      ① 在此撰寫／編輯文章，「儲存」後可立即在同一台電腦的前台預覽。
      ② 確認內容無誤後，點右上「匯出發佈檔」下載 <code>posts-data.js</code>。
      ③ 將下載的檔案覆蓋網站的 <code>assets/js/posts-data.js</code> 並重新上傳，全站訪客即可看到最新文章。
    </div>

    <div class="admin-grid">
      <!-- 文章列表 -->
      <aside class="panel">
        <div class="panel__head">
          <h2>文章列表</h2>
          <button class="btn btn--solid btn--small" id="btn-new" type="button">＋ 新文章</button>
        </div>
        <ul class="post-admin-list" id="admin-list"></ul>
        <div class="panel__body" style="border-top:1px solid var(--hairline);">
          <button class="btn btn--small" id="btn-export" type="button" style="width:100%;">⬇ 匯出發佈檔 posts-data.js</button>
        </div>
      </aside>

      <!-- 編輯區 -->
      <section class="panel">
        <div class="panel__head">
          <h2 id="editor-title">新增文章</h2>
          <span id="editor-status" style="font-size:0.8rem; color:var(--ink-soft);"></span>
        </div>
        <div class="panel__body">
          <div class="field">
            <label for="f-title">文章標題（建議包含關鍵字，例如「新奇美診所」或療程名稱）</label>
            <input type="text" id="f-title" placeholder="例：輪廓拉提怎麼選？醫師帶你認識三種主流拉提方式">
          </div>
          <div class="field-row">
            <div class="field">
              <label for="f-category">分類</label>
              <select id="f-category">
                <option>輪廓拉提</option>
                <option>微整注射</option>
                <option>光療雷射</option>
                <option>生髮治療</option>
                <option>體重控制</option>
                <option>婦產科</option>
                <option>家醫科</option>
                <option>保養知識</option>
                <option>診所公告</option>
              </select>
            </div>
            <div class="field">
              <label for="f-date">發佈日期</label>
              <input type="date" id="f-date">
            </div>
          </div>
          <div class="field">
            <label for="f-cover">封面圖片網址（建議 1200px 寬以上）</label>
            <input type="text" id="f-cover" placeholder="https://…">
          </div>
          <div class="field">
            <label for="f-excerpt">文章摘要（顯示於列表與搜尋結果，建議 60–100 字）</label>
            <textarea id="f-excerpt" rows="2" placeholder="用一兩句話說明這篇文章能幫讀者解決什麼問題…"></textarea>
          </div>

          <div class="field">
            <label>內文</label>
            <div class="toolbar" id="toolbar">
              <button type="button" data-cmd="formatBlock" data-val="h2" title="大標題">H2</button>
              <button type="button" data-cmd="formatBlock" data-val="h3" title="小標題">H3</button>
              <button type="button" data-cmd="formatBlock" data-val="p" title="內文段落">段落</button>
              <span class="sep"></span>
              <button type="button" data-cmd="bold" title="粗體"><b>B</b></button>
              <button type="button" data-cmd="italic" title="斜體"><i>I</i></button>
              <button type="button" data-cmd="underline" title="底線"><u>U</u></button>
              <span class="sep"></span>
              <button type="button" data-cmd="insertUnorderedList" title="項目符號">• 清單</button>
              <button type="button" data-cmd="insertOrderedList" title="編號清單">1. 清單</button>
              <button type="button" data-cmd="formatBlock" data-val="blockquote" title="引言">❝ 引言</button>
              <button type="button" data-cmd="insertHorizontalRule" title="分隔線">— 分隔線</button>
              <span class="sep"></span>
              <button type="button" id="btn-link" title="插入連結">🔗 連結</button>
              <button type="button" id="btn-image" title="插入圖片">🖼 圖片</button>
              <span class="sep"></span>
              <button type="button" data-cmd="removeFormat" title="清除格式">清除格式</button>
              <button type="button" id="btn-source" title="HTML 原始碼">&lt;/&gt;</button>
            </div>
            <div class="editor" id="editor" contenteditable="true"></div>
            <textarea id="html-source" spellcheck="false"></textarea>
          </div>

          <div class="actions">
            <button class="btn btn--solid" id="btn-save" type="button">儲存文章</button>
            <button class="btn" id="btn-preview" type="button">前台預覽 ↗</button>
            <button class="btn btn--danger btn--small" id="btn-delete" type="button" style="margin-left:auto;">刪除此文章</button>
          </div>
        </div>
      </section>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="../assets/js/posts-data.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
